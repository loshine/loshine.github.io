# Single-package project config for pnpm v10+
packages:
  - .

# Icarus still declares hexo ^7; pin transitive hexo to the site version (8.x).
# babel-plugin-inferno@6.9 needs Babel 8, but hexo-renderer-inferno still uses Babel 7.
overrides:
  hexo-theme-icarus>hexo: $hexo
  hexo-component-inferno>hexo: $hexo
  babel-plugin-inferno: ~6.8.0

# Relax icarus package.json so dependency.js accepts hexo 8.
patchedDependencies:
  hexo-theme-icarus@6.1.1: patches/hexo-theme-icarus@6.1.1.patch

allowBuilds:
  hexo-util: true
  inferno: true

strictDepBuilds: false

# Intentionally not on absolute latest — peer/runtime constraints above.
updateConfig:
  ignoreDependencies:
    - babel-plugin-inferno
    - "@babel/preset-env"
    - eslint
